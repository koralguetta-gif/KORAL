<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>התדר שלך עכשיו</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070c;--card:#121220;--card2:#1a1a2e;--line:#242440;--text:#f4f2ff;--muted:#8d8aa8;--a:#ff4f7b;--b:#6c5cff;--ok:#32e6a1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Heebo',system-ui,sans-serif}
body{background:radial-gradient(900px 500px at 50% -20%,#1d1442 0%,var(--bg) 65%);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;min-height:36px}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;padding:6px;cursor:pointer}
.chip{background:var(--card);border:1px solid var(--line);color:var(--text);font:inherit;font-size:14px;padding:7px 14px;border-radius:99px;cursor:pointer}
.hello{font-size:15px;color:var(--muted);line-height:1.6;margin-bottom:6px}
.noted{font-size:13px;color:var(--ok);margin-bottom:10px}
.stack{display:flex;align-items:center;gap:8px;width:100%;text-align:right;background:linear-gradient(135deg,rgba(255,79,123,.14),rgba(108,92,255,.14));border:1px solid #3a2f6e;color:var(--text);font:inherit;font-size:14px;padding:10px 14px;border-radius:14px;margin-bottom:14px;cursor:pointer}
.stack.big{margin:12px 0 4px;font-size:15px}
.eqs{display:inline-flex;gap:2px;align-items:flex-end;height:14px}.eqs i{width:3px;height:5px;background:var(--a);border-radius:2px}
.stack.playing .eqs i{animation:eq .7s infinite}.stack.playing .eqs i:nth-child(2){animation-delay:.2s}.stack.playing .eqs i:nth-child(3){animation-delay:.4s}
.q{font-size:25px;font-weight:700;line-height:1.25;margin-bottom:4px}
.sub{font-size:14px;color:var(--muted);margin-bottom:16px}
.guide{background:rgba(50,230,161,.08);border:1px solid rgba(50,230,161,.35);color:var(--text);border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.6;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:14px 16px;cursor:pointer;transition:border-color .2s,transform .1s}
.opt:active{transform:scale(.985)}
.opt.playing{border-color:var(--a);background:linear-gradient(135deg,rgba(255,79,123,.12),rgba(108,92,255,.12))}
.row{display:flex;align-items:center;gap:14px}
.play{width:54px;height:54px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:19px}
.opt.playing .play{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent}
.eq{display:none;gap:3px;align-items:flex-end;height:20px}.opt.playing .eq{display:flex}.opt.playing .tri{display:none}
.eq i{width:4px;background:#fff;border-radius:2px;animation:eq .7s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
.name{font-weight:700;font-size:19px}.desc{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.5}.desc.big{font-size:16px;color:var(--text);margin:8px 0}
.choose{display:none;margin-top:12px;width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;font-size:17px;color:#0a0a14;background:var(--ok);cursor:pointer}
.opt.playing .choose{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:700;font-size:16px;color:#fff;cursor:pointer;margin-top:12px}
.btn.primary{background:linear-gradient(135deg,var(--a),var(--b))}.btn.ok{background:var(--ok);color:#0a0a14}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);font-weight:500}
.tiny{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
.res{background:linear-gradient(135deg,rgba(255,79,123,.18),rgba(108,92,255,.18));border:1px solid #3a2f6e;border-radius:24px;padding:20px 18px;margin-bottom:14px}
.res .k{font-size:13px;color:var(--muted);margin-bottom:4px}.res .name{font-size:32px;font-weight:900;line-height:1.1}
.res .en{font-size:14px;color:var(--muted);direction:ltr;text-align:right;margin-top:2px}
.tell{font-size:15px;line-height:1.65;margin-top:12px}
.pl,.alt{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.pl h2{font-size:18px;margin:0 0 8px}.alt .k{font-size:13px;color:var(--muted);margin-bottom:8px}
.tr{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}.tr:first-of-type{border-top:0}
.cv{width:46px;height:46px;border-radius:10px;background:var(--card2);flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cv span{position:relative;z-index:1;color:#fff;text-shadow:0 1px 4px #000}
.tr.playing .cv::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,79,123,.75),rgba(108,92,255,.75));z-index:1}
.t{flex:1;min-width:0;direction:ltr;text-align:right}.t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t span{font-size:13px;color:var(--muted)}
.yt{font-size:13px;font-weight:700;color:var(--text);text-decoration:none;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;white-space:nowrap}
.mix{display:block;text-align:center;margin-top:10px;color:var(--muted);font-size:14px;text-decoration:none}
.fb{display:flex;gap:10px}.fb .btn{margin-top:0}
.nbs{display:flex;flex-wrap:wrap;gap:8px}.nb{background:var(--card2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:15px;padding:9px 14px;border-radius:99px;cursor:pointer}
.shim{height:12px;width:65%;border-radius:6px;background:linear-gradient(90deg,var(--line),var(--card2),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(7,7,12,0),rgba(7,7,12,.92) 30%);z-index:5}
.bar .in{max-width:480px;margin:0 auto;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 5px 5px 6px}
.bar input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;padding:9px 12px;min-width:0}
.bar button{width:42px;height:42px;border-radius:50%;border:0;font-size:18px;cursor:pointer;flex-shrink:0}
#mic{background:var(--card2);color:var(--text)}#mic.on{background:var(--a);animation:pulse 1s infinite}
#go{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,79,123,.25)}}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 12px}.dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}.dots i.on{background:linear-gradient(90deg,var(--a),var(--b))}
.trail{font-size:13px;color:var(--ok);margin-bottom:8px;line-height:1.5}
.opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.grid .opt{padding:12px}.opts.grid .row{flex-direction:column;align-items:flex-start;gap:8px}.opts.grid .play{width:46px;height:46px}.opts.grid .name{font-size:16px}.opts.grid .desc{font-size:12px}
.opts.grid .opt.playing{grid-column:1/-1}.opts.grid .opt.playing .row{flex-direction:row;align-items:center}
.opt.loading .play{opacity:.45}.opt.broken{opacity:.45}
.trk{font-size:12px;color:var(--muted);margin-top:4px;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guide .her{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}.guide .her::before{content:"את: "}.guide .think{animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.4}}.guide .mem{display:block;font-size:12px;color:var(--ok);margin-top:6px}
.hrt{background:none;border:0;color:var(--a);font-size:20px;padding:4px 6px;cursor:pointer}.hrt.on,.hrt:disabled{opacity:1}
.sv .svh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.sv .name{font-size:20px}
.x{background:none;border:0;color:var(--muted);font-size:16px;padding:6px;cursor:pointer}
.top .chip{padding:7px 11px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#2a2a44;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:9;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="bar"><div class="in">
  <input id="say" placeholder="תכתבי או תגידי לי…" autocomplete="off" enterkeyhint="send">
  <button id="mic" onclick="toggleMic()" aria-label="לדבר">🎙</button>
  <button id="go" onclick="sendText()" aria-label="שלח">←</button>
</div></div>
<script>
/*STYLES*/
/*ENGINE*/
/*APP*/
</script>
</body>
</html>
