<head>

<style>
  :root{--bg:#07070c;--card:#121220;--card2:#1a1a2e;--line:#242440;--text:#f4f2ff;--muted:#8d8aa8;--a:#ff4f7b;--b:#6c5cff;--ok:#32e6a1}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Heebo',system-ui,sans-serif;min-height:100%}
  body{background:radial-gradient(900px 500px at 50% -20%,#1d1442 0%,var(--bg) 65%)}
  .app{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
  h1{font-weight:900;font-size:32px;margin:0 0 8px;line-height:1.1;letter-spacing:-.5px}
  h2{font-weight:700;font-size:20px;margin:0}
  p{line-height:1.6;margin:0 0 12px;color:var(--muted)}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .pill{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:99px}
  .back{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:6px}
  .dots{display:flex;gap:6px;margin:8px 0 18px}
  .dots i{flex:1;height:4px;border-radius:9px;background:var(--line)}
  .dots i.on{background:linear-gradient(90deg,var(--a),var(--b))}
  .q{font-size:24px;font-weight:700;margin:0 0 4px;line-height:1.25}
  .sub{font-size:14px;color:var(--muted);margin-bottom:18px}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px;cursor:pointer;position:relative;transition:border-color .2s,transform .1s;overflow:hidden}
  .opt:active{transform:scale(.985)}
  .opt.loading{opacity:.6;pointer-events:none}
  .opt.playing{border-color:var(--a);background:linear-gradient(135deg,rgba(255,79,123,.12),rgba(108,92,255,.12))}
  .opt .row{display:flex;align-items:center;gap:14px}
  .play{width:56px;height:56px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;border:1px solid var(--line);position:relative;overflow:hidden}
  .play img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
  .play .tri,.play .eq{position:relative;z-index:1}
  .opt.playing .play{border-color:transparent}
  .opt.playing .play::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,79,123,.75),rgba(108,92,255,.75));z-index:1}
  .eq{display:none;gap:3px;align-items:flex-end;height:20px}
  .opt.playing .eq{display:flex}.opt.playing .tri{display:none}
  .eq i{width:4px;background:#fff;border-radius:2px;animation:eq .7s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
  @keyframes eq{0%,100%{height:5px}50%{height:20px}}
  .opt .name{font-weight:700;font-size:18px}
  .opt .desc{font-size:13px;color:var(--muted);margin-top:2px}
  .opt .track{font-size:12px;color:var(--muted);margin-top:4px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
  .opt .track.shim{height:12px;width:60%;border-radius:6px;background:linear-gradient(90deg,var(--line),var(--card2),var(--line));background-size:200% 100%;animation:shim 1.2s infinite}
  @keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .bar{position:absolute;bottom:0;right:0;height:3px;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .25s linear}
  .choose{display:none;margin-top:14px;width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;font-size:16px;color:#0a0a14;background:var(--ok);cursor:pointer}
  .opt.playing .choose{display:block;animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .votes{position:absolute;top:12px;left:14px;background:var(--b);color:#fff;font-size:13px;font-weight:700;border-radius:99px;padding:3px 10px}
  .btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:700;font-size:17px;color:#fff;cursor:pointer;margin-top:12px}
  .btn.primary{background:linear-gradient(135deg,var(--a),var(--b))}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);font-weight:500;font-size:15px}
  .btn:active{transform:scale(.98)}

  .hero .big{font-size:64px;margin-bottom:8px}

  .mode button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:10px;border-radius:99px;cursor:pointer}
  .mode button.on{background:var(--card2);color:var(--text)}

  .res .name{font-size:28px;font-weight:900;line-height:1.15;margin-bottom:6px}
  .res .desc{color:var(--text);opacity:.85;font-size:15px;margin-bottom:6px}

  .links a{flex:1;text-align:center;text-decoration:none;color:var(--text);background:rgba(255,255,255,.08);border-radius:12px;padding:11px;font-size:14px;font-weight:500}
  .alt{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
  .alt .name{font-size:19px;font-weight:700}
  .alt .k{font-size:13px;color:var(--muted);margin-bottom:4px}
  .alt .desc{font-size:14px;color:var(--muted)}

  .why ul{margin:6px 0 0;padding:0 18px 0 0;color:var(--muted);line-height:1.7;font-size:14px}
  .why b{color:var(--text)}
  .pl{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
  .pl h2{margin-bottom:10px}
  .tr{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
  .tr:first-of-type{border-top:0}

  .tr .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tr .cv span{position:relative;z-index:1;font-size:16px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}

  .tr .t{flex:1;min-width:0;direction:ltr;text-align:right}
  .tr .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr .t span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .tr a{color:var(--muted);text-decoration:none;font-size:18px;padding:6px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ok);color:#0a0a14;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}

  .tiny{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
  .err{background:rgba(255,79,123,.12);border:1px solid var(--a);border-radius:14px;padding:12px;font-size:14px;color:var(--text);margin-top:12px}

<script>
/* ===================== API ===================== */
const API_BASE = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? location.origin + location.pathname.replace(/\/+$/,'') : 'https://vofpzkcvncbvmnxrmhyc.supabase.co/functions/v1/tadar';
const api = (p, params) => {
  const u = new URL(API_BASE + '/api/' + p);
  Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k, typeof v==='string'?v:JSON.stringify(v)));
  return fetch(u).then(r=>{ if(!r.ok) throw new Error('api '+r.status); return r.json(); });
};

/* ===================== PLAYER (real previews) ===================== */
const SEG_START = 6; let SEG_LEN = 8;
let audio = null, onTick = null, curKey = null;
function ensureAudio(){
  if(audio) return audio;
  audio = new Audio(); audio.preload = 'auto'; audio.crossOrigin = null;
  audio.addEventListener('timeupdate', ()=>{
    if(audio.currentTime >= SEG_START + SEG_LEN){ try{ audio.currentTime = SEG_START; }catch(e){} }
    onTick && onTick(audio.currentTime);
  });
  audio.addEventListener('ended', ()=>{ try{ audio.currentTime = SEG_START; audio.play(); }catch(e){} });
  audio.addEventListener('error', ()=>{ stopAll(); alertish('הקטע לא נטען, נסי כרטיס אחר'); });
  return audio;
}
function playUrl(url, key, tick){
  const a = ensureAudio();
  curKey = key; onTick = tick;
  if(a.src !== url){ a.src = url; a.load(); }
  const start = ()=>{ try{ a.currentTime = SEG_START; }catch(e){} };
  if(a.readyState >= 1) start(); else a.addEventListener('loadedmetadata', start, {once:true});
  const p = a.play(); if(p && p.catch) p.catch(()=>{});
  window.__nowPlaying = key;
}
function stopAll(){
  if(audio){ try{ audio.pause(); }catch(e){} }
  curKey = null; onTick = null; window.__nowPlaying = null;
  document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing'));
  document.querySelectorAll('.bar').forEach(b=>b.style.width='0');
}

/* ===================== IDENTITY & MEMORY ===================== */
function userKey(){
  try{ let k=localStorage.getItem('tadar_user'); if(!k){ k=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join(''); localStorage.setItem('tadar_user',k); } return k; }
  catch(e){ return window.__tmpKey||(window.__tmpKey='tmp'+Math.random().toString(36).slice(2,14)); }
}
const UK = userKey();
function nowCtx(){ const d=new Date(); return {local_hour:d.getHours(), weekday:d.getDay(), tz:Intl.DateTimeFormat().resolvedOptions().timeZone||null}; }
const post = (p, body) => fetch(API_BASE+'/api/'+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(r=>r.ok?r.json():Promise.reject(new Error('api '+r.status)));
let ME = null;
async function loadMe(){ try{ ME=await api('me',{u:UK}); SEG_LEN=Math.max(5,Math.min(20,ME.listen_seconds||8)); }catch(e){ ME=null; } return ME; }
function moment(m){
  const body=Object.assign({user_key:UK, context:S.context||null}, nowCtx(), m);
  return post('moment',body).then(r=>{ if(r&&r.listen_seconds){ ME=r; SEG_LEN=Math.max(5,Math.min(20,r.listen_seconds)); } return r; }).catch(()=>null);
}
const ytUrl = t => `https://www.youtube.com/results?search_query=${enc((t.artist||'')+' '+(t.title||''))}`;
function openYT(t, cell){
  moment({action:'open', layer:'result', cell:cell||null, track_id:t.id||null, track_title:t.title||null, track_artist:t.artist||null, reaction:'opened'});
}

const enc = s => encodeURIComponent(s);
const yt = s => `https://www.youtube.com/results?search_query=${enc(s+' music mix')}`;
const sp = s => `https://open.spotify.com/search/${enc(s)}`;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Which leaf cell does a card at the current layer play? Only one variable changes between cards. */
function cellFor(v){
  const L=LAYERS[S.layer].id, p=S.picks;
  const c={timbre:p.timbre||'acoustic',tempo:p.tempo||'mid',mood:p.mood||'major',voice:p.voice||'yes'};
  c[L]=v;
  if(L==='timbre'){ c.tempo='mid'; c.mood='major'; c.voice='yes'; }
  if(L==='tempo'){ c.mood='major'; c.voice='yes'; }
  if(L==='mood'){ c.voice='yes'; }
  return c;
}
const leaf = c => R[c.timbre][c.tempo][c.mood][c.voice];

/* ===================== TRACK RESOLUTION ===================== */
const trackCache = {};
async function resolveCell(c){
  const key=[c.timbre,c.tempo,c.mood,c.voice].join('/');
  if(trackCache[key]) return trackCache[key];
  const seeds=leaf(c)[4];
  const t = await api('pick',{s:seeds});
  if(t && t.preview) trackCache[key]=t;
  return t;
}

  if(S.screen==='home'||S.screen==='intro') return renderHome();
  if(S.screen==='talk') return renderTalk();
  if(S.screen==='trust') return renderTrust();
  if(S.screen==='layer') return renderLayer();
  if(S.screen==='result') return renderResult();
}

async function renderTrust(){
  $app.innerHTML=`
   <div class="top"><span class="pill">תסמוך עליי</span><button class="back" onclick="S.screen='home';render()">→ חזרה</button></div>
   ${S.context?`<div class="sub">עכשיו: ${esc(S.context)}</div>`:''}
   <div class="res"><div class="name" style="font-size:20px">רגע, חושב…</div><div class="track shim" style="width:60%;margin-top:10px"></div></div>`;
  let r=null;
  try{ const c=nowCtx(); r=await api('trust',{u:UK,hour:String(c.local_hour),weekday:String(c.weekday),context:S.context||''}); }catch(e){}
  if(S.screen!=='trust') return;
  if(!r){ $app.querySelector('.res').innerHTML=`<div class="name" style="font-size:20px">אין לי חיבור לזיכרון כרגע.</div><button class="btn primary" onclick="startListen()">🎧 בואי נקשיב בינתיים</button>`; return; }
  moment({action:'trust', layer:'ask', cell:r.cell||null, reaction:null, meta:{status:r.status}});
  if(!r.cell){
    $app.querySelector('.res').innerHTML=`<div class="k">ביושר</div><div class="desc" style="font-size:17px;line-height:1.6">${esc(r.message)}</div>
      <button class="btn primary" onclick="startListen()">🎧 בואי נקשיב ביחד</button>`;
    return;
  }
  const [ti,te,mo,vo]=r.cell.split('/'); const leafC=(R[ti]&&R[ti][te]&&R[ti][te][mo]&&R[ti][te][mo][vo])||null;
  let track=null;
  try{ track = r.track&&r.track.id ? await api('track',{id:String(r.track.id)}) : null; }catch(e){}
  if(!track && leafC){ try{ track=await api('pick',{s:leafC[4]}); }catch(e){} }
  if(S.screen!=='trust') return;
  const name=leafC?leafC[0]:r.cell;
  $app.querySelector('.res').outerHTML=`
    <div class="res">
      <div class="k">${r.status==='confident'?'מביא':'ניחוש – ואני אומר שזה ניחוש'}</div>
      <div class="name">${esc(name)}</div>
      <div class="desc">${esc(r.message)}</div>
      ${track?`<div class="tr" id="tr-trust" onclick="playTrust()" style="border:0;margin-top:8px"><div class="cv">${track.cover?`<img src="${esc(track.cover)}" alt="" onerror="this.remove()">`:''}<span>▶</span></div><div class="t"><b>${esc(track.title)}</b><span>${esc(track.artist)}</span></div></div>
      <div class="links"><a href="${ytUrl(track)}" target="_blank" rel="noopener" onclick="openYT(window.__trustTrack,'${r.cell}')">▶ פתחי ביוטיוב</a></div>`:''}
      <div class="links"><a href="#" onclick="event.preventDefault();trustFeedback('${r.cell}','yes')" style="background:var(--ok);color:#0a0a14;font-weight:700">פגעת ✓</a><a href="#" onclick="event.preventDefault();trustFeedback('${r.cell}','no')">לא זה ✗</a></div>
    </div>`;
  window.__trustTrack=track; window.__trustCell=r.cell;
}
function playTrust(){ const t=window.__trustTrack; if(!t||!t.preview) return; if(curKey==='tr-trust'){ stopAll(); return; } stopAll(); document.getElementById('tr-trust').classList.add('playing'); playUrl(t.preview,'tr-trust',null); }
function trustFeedback(cell,ans){
  const t=window.__trustTrack||{}; const [ti,te,mo,vo]=cell.split('/'); const leafC=R[ti][te][mo][vo];
  moment({action:'trust', layer:'voice', cell, track_id:t.id||null, track_title:t.title||null, track_artist:t.artist||null, reaction:ans, meta:{cell_name:leafC[0]}});
  if(ans==='yes'){ alertish('רשמתי לי 🙏'); setTimeout(()=>{ S.screen='home'; ME=null; render(); },900); }
  else { alertish('בסדר, בואי נקשיב'); setTimeout(startListen,700); }
}

function renderLayer(){
  const L=LAYERS[S.layer];
  S.tracks={}; S.played={};
  $app.innerHTML=`
   <div class="top"><span class="pill">רובד ${S.layer+1} מתוך ${LAYERS.length}${S.context?` · ${esc(S.context)}`:''}</span>${S.layer>0?`<button class="back" onclick="goBack()">→ רובד קודם</button>`:`<button class="back" onclick="S.screen='home';render()">→ חזרה</button>`}</div>
   <div class="dots">${LAYERS.map((_,i)=>`<i class="${i<=S.layer?'on':''}"></i>`).join('')}</div>
   <div class="q">${L.q}</div><div class="sub">${L.sub}</div>
   <div class="opts">${L.opts.map(o=>`
     <div class="opt loading" id="opt-${o.v}" onclick="tap('${o.v}')">
       ${S.group?`<span class="votes">${S.votes[o.v]||0}</span>`:''}
       <div class="row">
         <div class="play" id="play-${o.v}"><span class="tri">▶</span><span class="eq"><i></i><i></i><i></i><i></i></span></div>
         <div style="min-width:0;flex:1"><div class="name">${o.icon} ${o.name}</div><div class="desc">${o.desc}</div><div class="track shim" id="trk-${o.v}"></div></div>
       </div>
       <button class="choose" onclick="event.stopPropagation();choose('${o.v}')">${S.group?'+ זה נעים לי':'זה נעים לי ✓'}</button>
       <div class="bar" id="bar-${o.v}"></div>
     </div>`).join('')}
   </div>
   ${S.group?`<button class="btn ghost" onclick="closeRound()">סוגרים סבב ←</button>`:''}
   <div class="tiny">אפשר לעבור בין הכרטיסים כמה שרוצים לפני שבוחרים</div>`;
  const layerAtRender=S.layer;
  L.opts.forEach(async o=>{
    try{
      const t=await resolveCell(cellFor(o.v));
      if(S.screen!=='layer'||S.layer!==layerAtRender) return;
      const el=document.getElementById('opt-'+o.v), tk=document.getElementById('trk-'+o.v);
      if(!el) return;
      if(t && t.preview){
        S.tracks[o.v]=t; el.classList.remove('loading');
        tk.classList.remove('shim'); tk.textContent=`${t.artist} · ${t.title}`;
        if(t.cover){ const img=document.createElement('img'); img.src=t.cover; img.alt=''; img.onerror=()=>img.remove(); document.getElementById('play-'+o.v).prepend(img); }
      } else { tk.classList.remove('shim'); tk.textContent='לא נמצא קטע – נסי כרטיס אחר'; el.classList.remove('loading'); }
    }catch(e){
      const tk=document.getElementById('trk-'+o.v), el=document.getElementById('opt-'+o.v);
      if(tk){ tk.classList.remove('shim'); tk.textContent='אין חיבור לרגע'; }
      if(el) el.classList.remove('loading');
    }
  });
}
function tap(v){
  const t=S.tracks[v]; if(!t) return;
  if(curKey===v){ stopAll(); return; }
  stopAll(); S.played[v]=true;
  document.getElementById('opt-'+v).classList.add('playing');
  const bar=document.getElementById('bar-'+v);
  playUrl(t.preview, v, ct=>{ if(bar) bar.style.width=Math.min(100,Math.max(0,(ct-SEG_START)/SEG_LEN*100))+'%'; });
}
function choose(v){
  if(S.group){ S.votes[v]=(S.votes[v]||0)+1; document.querySelector('#opt-'+v+' .votes').textContent=S.votes[v]; return; }
  advance(v);
}
function closeRound(){
  const L=LAYERS[S.layer]; let best=null,bn=-1;
  L.opts.forEach(o=>{ const n=S.votes[o.v]||0; if(n>bn){bn=n;best=o.v;} });
  if(bn<=0){ alertish('עוד אף אחד לא הצביע'); return; }
  advance(best);
}
function advance(v){
  const L=LAYERS[S.layer].id;
  // זיכרון: "זה" על הכרטיס שנבחר, "לא זה" על כרטיסים ששמעה ולא בחרה
  LAYERS[S.layer].opts.forEach(o=>{
    if(o.v!==v && !S.played[o.v]) return;
    const c=cellFor(o.v), t=S.tracks[o.v]||{}, lf=leaf(c);
    moment({action:'listen', layer:L, cell:[c.timbre,c.tempo,c.mood,c.voice].join('/'), track_id:t.id||null, track_title:t.title||null, track_artist:t.artist||null, reaction:o.v===v?'yes':'no', meta:{cell_name:lf[0], card:o.v}});
  });
  S.played={};
  S.picks[LAYERS[S.layer].id]=v; S.votes={};
  if(S.layer<LAYERS.length-1){ S.layer++; S.screen='layer'; } else { S.screen='result'; }
  render();
}
function goBack(){ S.layer--; S.votes={}; render(); }
function alertish(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

          <div class="cv">${t.cover?`<img src="${esc(t.cover)}" alt="" onerror="this.remove()">`:''}<span>▶</span></div>
          <div class="t"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div>
          <a href="${ytUrl(t)}" target="_blank" rel="noopener" onclick="event.stopPropagation();openYT(PL.tracks[${i}],'${S.picks.timbre}/${S.picks.tempo}/${S.picks.mood}/${S.picks.voice}')" title="לפתוח ביוטיוב" style="font-size:13px;font-weight:700;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px">▶ יוטיוב</a>
        </div>`).join('')}
      ${r.playlist?`<div class="links"><a href="${esc(r.playlist.link)}" target="_blank" rel="noopener">הפלייליסט המלא בדיזר ↗</a></div>`:''}`;
    S._copy += '\n\n' + tracks.map(t=>`• ${t.artist} – ${t.title}`).join('\n');
  }catch(e){
    if(box) box.innerHTML=`<h2>10 שירים להתחיל מהם</h2><div class="desc" style="color:var(--muted);font-size:14px">לא הצלחתי לטעון פלייליסט כרגע. לדוגמה: ${main[2]}</div>`;
  }
}
function playTr(i){
  const t=PL&&PL.tracks[i]; if(!t||!t.preview) return;
  const key='tr-'+i;
  if(curKey===key){ stopAll(); return; }
  stopAll();
  document.getElementById(key).classList.add('playing');
  playUrl(t.preview,key,null);
}
function copyRes(){
  const text=S._copy;
  const ok=()=>alertish('הועתק');
  try{ navigator.clipboard.writeText(text).then(ok).catch(()=>fb(text)); }catch(e){ fb(text); }
  function fb(t){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');ok();}catch(e){} document.body.removeChild(ta); }
}
window.__S=()=>S; window.__R=R; window.__UK=UK;
loadMe().then(render); render();
</script>
